<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>UNews Extension</title>
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }
    .section {
      margin-bottom: 15px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 5px;
    }
    .section h2 {
      font-size: 14px;
      margin: 0 0 10px 0;
      color: #666;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
      font-size: 14px;
    }
    button:hover {
      background: #45a049;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      padding: 10px;
      background: #e3f2fd;
      border-radius: 5px;
      margin-top: 10px;
      font-size: 12px;
      color: #1976d2;
    }
    #pageInfo {
      font-size: 12px;
      line-height: 1.6;
      color: #555;
    }
    .info-row {
      margin-bottom: 5px;
    }
    .label {
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>UNews Extension</h1>

  <div class="section">
    <h2>Page Actions</h2>
    <button id="getPageData">Get Page Data</button>
    <button id="highlightPage">Highlight Page</button>
    <button id="injectContent">Show Banner</button>
  </div>

  <div class="section">
    <h2>Current Page Info</h2>
    <div id="pageInfo">
      <div class="info-row"><span class="label">Title:</span> <span id="pageTitle">-</span></div>
      <div class="info-row"><span class="label">URL:</span> <span id="pageUrl">-</span></div>
      <div class="info-row"><span class="label">Links:</span> <span id="linksCount">-</span></div>
      <div class="info-row"><span class="label">Images:</span> <span id="imagesCount">-</span></div>
    </div>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
